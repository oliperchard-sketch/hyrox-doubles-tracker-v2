<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="HYROX 8-Week Doubles Training Tracker v2">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>HYROX Doubles Tracker v2</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#101828;--muted:#667085;--line:#dfe3e8;--accent:#111827;--soft:#eef2ff;--ok:#067647;--warn:#b54708;--danger:#b42318}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-weight:650;cursor:pointer;color:var(--text)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.soft{background:var(--soft)}button.danger{color:var(--danger)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;min-height:44px;color:var(--text)}textarea{resize:vertical}.app{max-width:1000px;margin:auto;padding:14px 12px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand h1{margin:0;font-size:24px}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;gap:10px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat strong{display:block;font-size:20px}.bar{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);width:0}.weeks,.days{display:flex;gap:7px;overflow:auto;padding:4px 0}.weeks button,.days button{white-space:nowrap}.weeks button.active,.days button.active{background:var(--soft);border-color:#98a2b3}.session-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.session-head h2{margin:2px 0;font-size:21px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.section{margin-top:17px}.section h3{font-size:15px;margin:0 0 7px}.section ul{margin:0;padding-left:20px}.section li{margin:5px 0}.coach{border-left:3px solid var(--line);padding-left:10px;color:#475467;white-space:pre-line}.exercise{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.exercise-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.exercise h4{margin:0;font-size:15px}.target{color:var(--muted);font-size:12px;margin-top:3px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:8px;min-width:500px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px;font-size:12px}td input{min-height:38px;padding:6px}td input[type=checkbox]{width:20px;height:20px}.history{font-size:12px;color:var(--muted);margin-top:6px}.notice{padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.hidden{display:none!important}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.section-toggle{cursor:pointer}.export-row{display:flex;gap:8px;flex-wrap:wrap}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.checkline{display:flex;gap:8px;align-items:center}.checkline input{width:20px;height:20px}.footer{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.session-head{flex-direction:column}.app{padding:10px 9px 40px}}
</style>
</head>
<body>
<main class="app" id="app">
<div class="top"><div class="brand"><div class="muted small">8-week training tracker · v2</div><h1>HYROX Doubles</h1></div><button id="installBtn" class="primary hidden">Install app</button></div>
<div class="toolbar"><button id="todayBtn" type="button">Today</button><button id="calendarBtn" type="button">Calendar</button><button id="progressBtn" type="button">Progress</button><button id="settingsBtn" type="button">Settings</button></div>
<section id="mainView">
<div class="grid grid2"><div class="field"><label>Programme start</label><input id="start" type="date"></div><div class="field"><label>Race date</label><input id="race" type="date"></div></div>
<div class="stats" style="margin-top:10px"><div class="stat"><span class="muted small">Sessions</span><strong id="doneCount">0 / 56</strong></div><div class="stat"><span class="muted small">Completion</span><strong id="pct">0%</strong></div><div class="stat"><span class="muted small">Selected date</span><strong id="dateLabel">—</strong></div><div class="stat"><span class="muted small">Race countdown</span><strong id="countdown">—</strong></div></div>
<div class="bar"><i id="bar"></i></div>
<div class="weeks" id="weeks"></div><div class="days" id="days"></div><div id="content"></div>
</section>
<section id="calendarView" class="hidden"></section><section id="progressView" class="hidden"></section><section id="settingsView" class="hidden"></section>
<div class="footer">Your logs stay on this device unless you export a backup.</div>
</main>
<script src="data.js"></script>
<script>
(()=>{if(window.__HYROX_V2__)return;window.__HYROX_V2__=true;
const data=window.HYROX_DATA;const $=id=>document.getElementById(id);const STORE='hyroxTrackerV2';
const defaultState={start:'2026-10-12',race:'',done:{},logs:{}};let state={...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')};state.done??={};state.logs??={};
let wi=0,di=0;let deferredPrompt=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateObj(w=wi,d=di){const base=new Date((state.start||defaultState.start)+'T00:00:00Z');base.setUTCDate(base.getUTCDate()+w*7+d);return base}
function dateKey(w,d){return dateObj(w,d).toISOString().slice(0,10)}
function fmtDate(d){return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}
function sessionKey(w,d){return `w${data.weeks[w].week}-${data.weeks[w].sessions[d].day}`}
function save(){localStorage.setItem(STORE,JSON.stringify(state));renderStats()}
function allSessions(){return data.weeks.flatMap((w,widx)=>w.sessions.map((s,didx)=>({...s,widx,didx,key:sessionKey(widx,didx),date:dateKey(widx,didx)})))}
function renderStats(){const n=Object.values(state.done).filter(Boolean).length,p=Math.round(n/56*100);$('doneCount').textContent=`${n} / 56`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('dateLabel').textContent=fmtDate(dateObj());const race=state.race?new Date(state.race+'T00:00:00Z'):dateObj(7,5);const days=Math.ceil((race-Date.now())/86400000);$('countdown').textContent=days>=0?days+'d':'Race passed'}
function renderWeeks(){const el=$('weeks');el.innerHTML='';data.weeks.forEach((w,i)=>{const b=document.createElement('button');b.textContent='Week '+w.week;b.className=i===wi?'active':'';b.onclick=()=>{wi=i;di=0;showMain();render()};el.appendChild(b)})}
function renderDays(){const el=$('days');el.innerHTML='';data.weeks[wi].sessions.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.day.slice(0,3);b.className=i===di?'active':'';b.onclick=()=>{di=i;render()};el.appendChild(b)})}
function splitBody(body){const raw=body.split(/\n/).map(x=>x.trim()).filter(Boolean);const sections=[];let cur={title:'Session details',items:[]};const heads=/^(Warm-?up|Warm-Up|Main Set|Working Set|Strength Block|Sled Intervals|Sled Power|Conditioning|Cool-?down|Cool-Down|Speed Finisher|Finisher|Optional Machine Work|Machine Work|Hyrox EMOM|Coaching Tips|Scoring|Notes|Guidelines|Activity Options|Activation Rounds|Run Prep|Speed Rounds|Race Mindset|Workout|Main Set.*|Round \d+|Super Set|AMRAP.*|Choose Your Option.*)$/i;for(const x0 of raw){const x=x0.replace(/^[-•]\s*/,'');if(heads.test(x)&&!/^Round \d+:/i.test(x)){if(cur.items.length)sections.push(cur);cur={title:x.replace(/:$/,'').trim(),items:[]}}else{if(/^Round \d+:/i.test(x)){if(cur.items.length)sections.push(cur);cur={title:x.replace(/:$/,'').trim(),items:[]}}else cur.items.push(x)}}if(cur.items.length)sections.push(cur);return sections}
function exerciseCandidates(body){const lines=body.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,''));const out=[];const ignore=/^(Warm|Main|Working|Coaching|Rest|Effort|Notes|Round|Finish|Complete|Continue|Focus|Choose|Activity|Guidelines|Push the|Pick a|Keep |Use |This |OR$)/i;for(const line of lines){if(ignore.test(line))continue;let m=line.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s*(.*))?$/i);if(m&&m[1].length<80){out.push({name:m[1].replace(/[:—-]$/,'').trim(),sets:+m[2],reps:m[3],target:(m[4]||'').trim()});continue}m=line.match(/^(.+?):\s*(\d+)\s*[x×]\s*(\d+)(?:\s*(.*))?$/i);if(m&&m[1].length<80)out.push({name:m[1].trim(),sets:+m[2],reps:m[3],target:(m[4]||'').trim()})}const seen=new Set();return out.filter(x=>{const k=x.name+'|'+x.sets+'|'+x.reps;if(seen.has(k))return false;seen.add(k);return true})}
function priorFor(exName,w,d){const sessions=allSessions();const currentIndex=sessions.findIndex(s=>s.widx===w&&s.didx===d);for(let i=currentIndex-1;i>=0;i--){const s=sessions[i],log=state.logs[s.key];if(!log?.exercises)continue;const e=log.exercises.find(x=>x.name===exName);if(e&&e.sets?.some(x=>x.weight||x.reps))return {session:s,e}}return null}
function renderExercise(ex,ei,log,skey){const prior=priorFor(ex.name,wi,di);let h=`<div class="exercise"><div class="exercise-head"><div><h4>${esc(ex.name)}</h4><div class="target">Prescribed: ${esc(ex.sets)} × ${esc(ex.reps)}${ex.target?' · '+esc(ex.target):''}</div></div></div>`;if(prior){const vals=prior.e.sets.filter(x=>x.weight||x.reps).map(x=>`${x.weight?x.weight+'kg':''}${x.reps?' × '+x.reps+' reps':''}`).join(' · ');h+=`<div class="history">Previous: ${esc(vals||'logged session')}</div>`}h+='<div class="table-wrap"><table><thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>RPE</th><th>Done</th></tr></thead><tbody>';for(let n=0;n<ex.sets;n++){const a=log.exercises?.[ei]?.sets?.[n]||{};h+=`<tr><td>${n+1}</td><td><input data-e="${ei}" data-s="${n}" data-f="weight" type="number" min="0" step="0.5" value="${esc(a.weight??'')}" placeholder="—"></td><td><input data-e="${ei}" data-s="${n}" data-f="reps" type="number" min="0" step="1" value="${esc(a.reps??'')}" placeholder="${esc(ex.reps)}"></td><td><input data-e="${ei}" data-s="${n}" data-f="rpe" type="number" min="1" max="10" step="1" value="${esc(a.rpe??'')}" placeholder="—"></td><td><input data-e="${ei}" data-s="${n}" data-f="done" type="checkbox" ${a.done?'checked':''}></td></tr>`}return h+'</tbody></table></div></div>'}
function render(){renderWeeks();renderDays();renderStats();const s=data.weeks[wi].sessions[di],k=sessionKey(wi,di),log=state.logs[k]||{};let h=`<div class="card"><div class="session-head"><div><div class="muted small">Week ${data.weeks[wi].week} · ${esc(s.day)} · ${fmtDate(dateObj())}</div><h2>${esc(s.name)}</h2></div><label class="checkline"><input id="done" type="checkbox" ${state.done[k]?'checked':''}> Completed</label></div>`;for(const sec of splitBody(s.body)){h+=`<div class="section"><h3>${esc(sec.title)}</h3>`;if(/coaching tips/i.test(sec.title)){h+=`<div class="coach">${sec.items.map(x=>esc(x)).join('\n')}</div>`}else{h+='<ul>'+sec.items.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'}h+='</div>'}const ex=exerciseCandidates(s.body);if(ex.length){h+='<div class="section"><h3>Exercise-by-exercise logging</h3><div class="notice">Prescribed targets come directly from the programme. Your actual results are stored separately.</div>';ex.forEach((e,i)=>h+=renderExercise(e,i,log,k));h+='</div>'}h+=`<div class="section"><div class="grid grid2"><div class="field"><label>Session RPE</label><input id="sessionRpe" type="number" min="1" max="10" value="${esc(log.rpe??'')}" placeholder="1–10"></div><div class="field"><label>Session time</label><input id="time" type="text" value="${esc(log.time||'')}" placeholder="e.g. 52:30"></div></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="notes" rows="3" placeholder="How did it go?">${esc(log.notes||'')}</textarea></div><button id="saveSession" class="primary" style="width:100%;margin-top:10px">Save session</button><div id="saved" class="muted small" style="margin-top:7px"></div></div></div>`;$('content').innerHTML=h;
$('done').onchange=e=>{state.done[k]=e.target.checked;save()};document.querySelectorAll('[data-e]').forEach(inp=>inp.addEventListener('change',()=>{state.logs[k]??={};state.logs[k].exercises??=[];const ei=+inp.dataset.e,si=+inp.dataset.s;state.logs[k].exercises[ei]??={name:ex[ei].name,sets:[]};state.logs[k].exercises[ei].sets??=[];const a=state.logs[k].exercises[ei].sets[si]??={};const f=inp.dataset.f;a[f]=inp.type==='checkbox'?inp.checked:inp.value;save()}));$('saveSession').onclick=()=>{state.logs[k]??={};state.logs[k].rpe=$('sessionRpe').value;state.logs[k].time=$('time').value;state.logs[k].notes=$('notes').value;save();$('saved').textContent='Saved on this device.'}}
function showMain(){['mainView','calendarView','progressView','settingsView'].forEach(id=>$(id).classList.add('hidden'));$('mainView').classList.remove('hidden')}
function calendar(){['mainView','progressView','settingsView'].forEach(id=>$(id).classList.add('hidden'));$('calendarView').classList.remove('hidden');let h='<div class="card"><h2>Programme calendar</h2><div class="muted small">Tap a session to open it.</div>';for(const s of allSessions()){const cls=state.done[s.key]?'✓ ':'';h+=`<button style="width:100%;text-align:left;margin-top:7px" data-cal="${s.widx}|${s.didx}"><strong>${cls}${esc(fmtDate(new Date(s.date+'T00:00:00Z')))}</strong> · Week ${s.widx+1} · ${esc(s.day)}<br><span class="muted small">${esc(s.name)}</span></button>`}h+='</div>';$('calendarView').innerHTML=h;document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{const [w,d]=b.dataset.cal.split('|').map(Number);wi=w;di=d;showMain();render()})}
function progress(){['mainView','calendarView','settingsView'].forEach(id=>$(id).classList.add('hidden'));$('progressView').classList.remove('hidden');const logs=Object.values(state.logs);const completedSets=logs.reduce((a,l)=>a+(l.exercises||[]).reduce((x,e)=>x+(e.sets||[]).filter(s=>s.done).length,0),0);let rows=allSessions().filter(s=>state.done[s.key]).slice().reverse().map(s=>{const l=state.logs[s.key]||{};return `<tr><td>${esc(fmtDate(new Date(s.date+'T00:00:00Z')))}</td><td>${esc(s.name)}</td><td>${esc(l.rpe||'—')}</td><td>${esc(l.time||'—')}</td></tr>`}).join('');$('progressView').innerHTML=`<div class="card"><h2>Progress</h2><div class="stats"><div class="stat"><span class="muted small">Sessions</span><strong>${Object.values(state.done).filter(Boolean).length}/56</strong></div><div class="stat"><span class="muted small">Set completions</span><strong>${completedSets}</strong></div><div class="stat"><span class="muted small">Notes logged</span><strong>${logs.filter(l=>l.notes).length}</strong></div><div class="stat"><span class="muted small">Current week</span><strong>${wi+1}</strong></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Session</th><th>RPE</th><th>Time</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">No completed sessions yet.</td></tr>'}</tbody></table></div></div>`}
function settings(){['mainView','calendarView','progressView'].forEach(id=>$(id).classList.add('hidden'));$('settingsView').classList.remove('hidden');$('settingsView').innerHTML=`<div class="card"><h2>Settings & backup</h2><p class="muted">Your training data is stored locally in this browser/app.</p><div class="export-row"><button id="export">Export backup</button><button id="importBtn">Import backup</button><input id="file" class="hidden" type="file" accept="application/json"></div><button id="reset" class="danger" style="margin-top:12px">Reset all training data</button><div id="settingMsg" class="muted small" style="margin-top:8px"></div></div>`;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hyrox-doubles-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const imported=JSON.parse(await e.target.files[0].text());if(!imported.logs||!imported.done)throw new Error();state={...defaultState,...imported};save();$('settingMsg').textContent='Backup imported.'}catch{$('settingMsg').textContent='That backup could not be imported.'}};$('reset').onclick=()=>{if(confirm('Delete all locally stored training data?')){state={...defaultState,start:$('start').value};save();render()}}}
$('start').value=state.start;$('race').value=state.race;$('start').onchange=()=>{state.start=$('start').value;save();render()};$('race').onchange=()=>{state.race=$('race').value;save();renderStats()};$('todayBtn').onclick=()=>{const base=new Date((state.start||defaultState.start)+'T00:00:00Z');const now=new Date();const diff=Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-base)/86400000);if(diff>=0&&diff<56){wi=Math.floor(diff/7);di=diff%7}else{wi=0;di=0}showMain();render()};$('calendarBtn').onclick=calendar;$('progressBtn').onclick=progress;$('settingsBtn').onclick=settings;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$('installBtn').classList.add('hidden')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
})();
</script></body></html>
