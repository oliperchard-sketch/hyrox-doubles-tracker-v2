<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>HYROX Doubles Tracker</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#dbe2ea;--accent:#111827;--soft:#eef2f7;--good:#166534}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}main{max-width:760px;margin:auto;padding:16px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}button,.tab{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 12px;font-weight:650;color:var(--text);cursor:pointer}.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.section{border-left:4px solid #cbd5e1;padding-left:12px;margin:16px 0}.section h3{margin-bottom:7px}
ul{margin:5px 0 0;padding-left:20px}li{margin:5px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{font-size:13px;color:var(--muted);display:block}input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--text);font-size:16px}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}
.exercise{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.exercise-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.exercise-name{font-weight:750}.target{font-size:12px;color:var(--muted);text-align:right}
table{width:100%;border-collapse:collapse;margin-top:9px;font-size:13px}th,td{padding:5px 3px;border-bottom:1px solid var(--line);text-align:left}td input{min-height:40px;padding:6px;font-size:15px}
.check{width:22px;height:22px;min-height:22px;accent-color:#111827}.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#111827}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:12px}.success{color:var(--good);font-weight:700}
.small-actions{display:flex;gap:7px;flex-wrap:wrap}.small-actions button{font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:20}
</style>
</head>
<body>
<main id="app">
<header><div><div class="muted">8-week programme</div><h1>HYROX Doubles Tracker</h1></div><span id="count" class="badge">0 / 56</span></header>
<nav id="mainnav"></nav>
<div id="view"></div>
<div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="data.js"></script>
<script>
(()=>{const root=document.getElementById("app"),view=document.getElementById("view"),toast=document.getElementById("toast");
const KEY="hyrox-v3-state";let state=JSON.parse(localStorage.getItem(KEY)||'{"start":"2026-10-12","race":"","logs":{}}');let viewName="today",selectedWeek=1,selectedDay="Monday";
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateCount()}
function toastMsg(t){toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",1300)}
function key(w,d){return w+"|"+d}
function getSession(w,d){return PROGRAMME.find(x=>x.week==="Week "+w&&x.day===d)}
function dateFor(w,d){if(!state.start)return "";let dt=new Date(state.start+"T00:00:00Z");dt.setUTCDate(dt.getUTCDate()+(w-1)*7+days.indexOf(d));return dt.toISOString().slice(0,10)}
function fmtDate(s){if(!s)return "";return new Date(s+"T00:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}
function updateCount(){let n=Object.values(state.logs).filter(x=>x.completed).length;document.getElementById("count").textContent=n+" / 56"}
function nav(){let items=[["today","Today"],["programme","Programme"],["calendar","Calendar"],["progress","Progress"],["settings","Settings"]];document.getElementById("mainnav").innerHTML=items.map(([id,t])=>`<button class="${viewName===id?"active":""}" data-nav="${id}">${t}</button>`).join("");document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{viewName=b.dataset.nav;render()})}
function render(){nav();if(viewName==="today")today();else if(viewName==="programme")programme();else if(viewName==="calendar")calendar();else if(viewName==="progress")progress();else settings();updateCount()}
function sessionCard(w,d){const s=getSession(w,d),k=key(w,d),log=state.logs[k]||{};if(!s)return "";
let html=`<div class="card"><div class="muted">Week ${w} · ${d} · ${fmtDate(dateFor(w,d))}</div><h2>${esc(s.title)}</h2>`;
html+=`<label style="margin-top:10px;color:var(--text)"><input class="check" type="checkbox" data-complete="${k}" ${log.completed?"checked":""}> Session completed</label>`;
for(const sec of s.sections){html+=`<div class="section"><h3>${esc(sec.name)}</h3>`;
if(sec.items?.length) html+="<ul>"+sec.items.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";
if(sec.exercises?.length){for(let ei=0;ei<sec.exercises.length;ei++){const e=sec.exercises[ei],id=k+"|"+ei, el=log.exercises?.[ei]||{};html+=exerciseBlock(id,e,el)}}html+="</div>"}
html+=`<div class="grid"><label>Session RPE<input type="number" min="1" max="10" data-field="${k}|rpe" value="${esc(log.rpe||"")}"></label><label>Session time<input type="text" data-field="${k}|time" placeholder="e.g. 52:30" value="${esc(log.time||"")}"></label></div><label style="margin-top:9px">Notes<textarea rows="3" data-field="${k}|notes">${esc(log.notes||"")}</textarea></label><button class="primary" style="width:100%;margin-top:10px" data-save="${k}">Save session</button></div>`;
return html}
function exerciseBlock(id,e,el){let sets=[];for(let i=0;i<e.sets;i++){let a=(el.sets||[])[i]||{};sets.push(`<tr><td>${i+1}</td><td><input type="number" min="0" step="0.5" placeholder="${e.metric==="distance"?"m":"kg"}" data-ex="${id}|${i}|weight" value="${esc(a.weight||"")}"></td><td><input type="text" placeholder="${esc(e.reps)}" data-ex="${id}|${i}|reps" value="${esc(a.reps||"")}"></td><td><input type="number" min="1" max="10" step="1" placeholder="—" data-ex="${id}|${i}|rpe" value="${esc(a.rpe||"")}"></td><td><input class="check" type="checkbox" data-ex="${id}|${i}|done" ${a.done?"checked":""}></td></tr>`)}
return `<div class="exercise"><div class="exercise-head"><div class="exercise-name">${esc(e.name)}</div><div class="target">Target: ${esc(e.sets)} × ${esc(e.reps)}${e.target?" · "+esc(e.target):""}</div></div><table><thead><tr><th>Set</th><th>${e.metric==="distance"?"Load":"Weight"}</th><th>Reps/target</th><th>RPE</th><th>✓</th></tr></thead><tbody>${sets.join("")}</tbody></table></div>`}
function wireSession(){document.querySelectorAll("[data-complete]").forEach(x=>x.onchange=()=>{let k=x.dataset.complete;state.logs[k]??={};state.logs[k].completed=x.checked;save()});
document.querySelectorAll("[data-field]").forEach(x=>x.oninput=()=>{let [k,f]=x.dataset.field.split("|");state.logs[k]??={};state.logs[k][f]=x.value;save()});
document.querySelectorAll("[data-ex]").forEach(x=>x.onchange=()=>{let p=x.dataset.ex.split("|"),k=p[0]+"|"+p[1],ei=+p[2],si=+p[3],f=p[4];state.logs[k]??={};state.logs[k].exercises??={};state.logs[k].exercises[ei]??={sets:[]};state.logs[k].exercises[ei].sets??=[];state.logs[k].exercises[ei].sets[si]??={};state.logs[k].exercises[ei].sets[si][f]=x.type==="checkbox"?x.checked:x.value;save()});
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>toastMsg("Session saved"))}
function today(){let target=null;for(let w=1;w<=8;w++)for(const d of days)if(dateFor(w,d)===new Date().toISOString().slice(0,10))target={w,d};if(!target)target={w:1,d:"Monday"};view.innerHTML=`<div class="card"><div class="muted">Today</div><div class="grid"><label>Programme start<input id="start" type="date" value="${esc(state.start)}"></label><label>Race date<input id="race" type="date" value="${esc(state.race||"")}"></label></div></div>${sessionCard(target.w,target.d)}`;document.getElementById("start").onchange=e=>{state.start=e.target.value;save();today()};document.getElementById("race").onchange=e=>{state.race=e.target.value;save()};wireSession()}
function programme(){let tabs=Array.from({length:8},(_,i)=>`<button class="${selectedWeek===i+1?"active":""}" data-w="${i+1}">Week ${i+1}</button>`).join("");let dt=days.map(d=>`<button class="${selectedDay===d?"active":""}" data-d="${d}">${d.slice(0,3)}</button>`).join("");view.innerHTML=`<div class="tabs" id="weeks">${tabs}</div><div class="tabs" id="days">${dt}</div>${sessionCard(selectedWeek,selectedDay)}`;document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{selectedWeek=+b.dataset.w;render()});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{selectedDay=b.dataset.d;render()});wireSession()}
function calendar(){let html="<div class='card'><h2>Programme calendar</h2><div class='muted'>"+fmtDate(state.start)+" start</div></div>";for(let w=1;w<=8;w++){html+=`<div class="card"><h3>Week ${w}</h3>`+days.map(d=>{let s=getSession(w,d),l=state.logs[key(w,d)];return `<button style="width:100%;text-align:left;margin:4px 0" data-cal="${w}|${d}"><b>${fmtDate(dateFor(w,d))} — ${esc(d)}</b><br><span class="muted">${esc(s.title)} ${l?.completed?" · ✓":""}</span></button>`}).join("")+"</div>"}view.innerHTML=html;document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{let [w,d]=b.dataset.cal.split("|");selectedWeek=+w;selectedDay=d;viewName="programme";render()})}
function progress(){let done=Object.values(state.logs).filter(x=>x.completed).length,pct=Math.round(done/56*100);let exCount=0;Object.values(state.logs).forEach(l=>{if(l.exercises)Object.values(l.exercises).forEach(e=>e.sets?.forEach(s=>{if(s.done)exCount++}))});view.innerHTML=`<div class="card"><h2>Progress</h2><div style="font-size:30px;font-weight:800;margin:8px 0">${done}/56</div><div class="progress"><div style="width:${pct}%"></div></div><div class="muted" style="margin-top:6px">${pct}% sessions completed · ${exCount} strength sets logged</div></div><div class="card"><h3>Data backup</h3><div class="small-actions"><button id="export">Export training data</button><button id="clear">Clear all data</button></div><p class="muted">Export creates a JSON backup you can keep if you change phone or browser.</p></div>`;
document.getElementById("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="hyrox-training-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById("clear").onclick=()=>{if(confirm("Delete all training data on this device?")){state={start:state.start,race:state.race,logs:{}};save();render()}}}
function settings(){view.innerHTML=`<div class="card"><h2>Settings</h2><label>Programme start date<input id="sstart" type="date" value="${esc(state.start)}"></label><label style="margin-top:10px">Race date<input id="srace" type="date" value="${esc(state.race||"")}"></label><p class="muted">Training data is stored locally in this browser. Use Progress → Export training data for a backup.</p></div>`;document.getElementById("sstart").onchange=e=>{state.start=e.target.value;save();render()};document.getElementById("srace").onchange=e=>{state.race=e.target.value;save();render()}}
render();
})();
</script>
</body></html>
